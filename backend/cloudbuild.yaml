substitutions:
  _TAG: latest
  _REGION: us-central1
  # The bucket where inference results (annotated video, H5, json) should be uploaded
  _OUTPUT_BUCKET: gs://dlc_bucket/dlc_output_main

steps:
  # Step 1: Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:$_TAG"
      - "-t"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:latest"
      - "-f"
      - "Dockerfile"
      - "."

  # Step 2: Push tagged version
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:$_TAG"

  # Step 3: Push latest version
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:latest"

  # Step 4: Deploy to Cloud Run with GPU
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "dlc-api-service"
      - "--image=$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:$_TAG"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--execution-environment=gen2"
      - "--memory=16Gi"
      - "--cpu=4"
      - "--timeout=3600"
      - "--max-instances=1"
      - "--min-instances=0"
      - "--gpu=1"
      - "--gpu-type=nvidia-l4"
      # One inference at a time per instance (GPU can't handle concurrent jobs)
      - "--concurrency=1"
      # Keep CPU active during cold starts
      - "--no-cpu-throttling"
      # Set the environment variable so the FastAPI app knows where to upload results
      - "--set-env-vars=DLC_GCS_OUTPUT_BUCKET=$_OUTPUT_BUCKET"

images:
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:$_TAG"
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/dlc/dlc-api:latest"

timeout: "3600s"

options:
  machineType: "E2_HIGHCPU_8"
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
